game: brawl_stars

window:
  mac_title: "iPhone Mirroring"

observation:
  frame_size: 84
  frame_stack: 4

action:
  joystick_radius: 0.10   # normalized drag distance from joystick center

timing:
  step_seconds: 0.25
  action_hold_frames: 2
  tap_duration: 0.05
  drag_duration: 0.15     # short joystick nudge per step

# All UI regions are normalized (x, y, w, h) fractions of the mirrored
# iPhone screen (landscape). Calibrate against real captures before live runs.
ui_regions:
  own_hp_bar: [0.43, 0.30, 0.14, 0.015]
  ammo_bar: [0.80, 0.72, 0.12, 0.05]
  super_button: [0.78, 0.55, 0.10, 0.12]
  result_banner: [0.30, 0.10, 0.40, 0.15]
  joystick_center: [0.15, 0.75, 0.0, 0.0]   # tap/drag points: (x, y), w/h unused
  attack_button: [0.85, 0.78, 0.0, 0.0]
  continue_button: [0.85, 0.92, 0.0, 0.0]
  play_button: [0.50, 0.85, 0.0, 0.0]

reward:
  gamma: 0.99
  survival: 0.01
  win_bonus: 5.0
  loss_penalty: -2.0

curriculum:
  phase_rounds: 200

ppo:
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  learning_rate: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
